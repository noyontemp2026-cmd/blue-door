<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Door</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Scene 1 -->
    <section id="welcome">

        <div class="content">

            <h1>This website is intended for only one person.</h1>

            <p>
                If you're not that person,<br>
                please don't continue.
            </p>

            <div class="buttons">

                <button id="mituBtn">
                    ❤️ I'm Mitu
                </button>

                <button id="otherBtn">
                    👤 Others
                </button>

            </div>

        </div>

    </section>



    <!-- Others Screen -->

    <section id="othersScreen" class="hidden">

        <div class="content">

            <h1>I'm sorry.</h1>

            <p>
                This website isn't for you.
            </p>

            <button id="leaveBtn">
                Leave
            </button>

        </div>

    </section>




    <!-- Scene 2 -->

    <section id="verifyScreen" class="hidden">

        <div class="box">

            <h2>Verification Required</h2>

            <p>
                Before entering...<br><br>
                Please prove you're really Mitu.
            </p>

            <input
                type="text"
                id="secretInput"
                placeholder="Enter the secret word..."
            >

            <button id="continueBtn">
                Continue →
            </button>

            <small id="message"></small>

        </div>

    </section>

<script src="script.js"></script>

</body>
</html>
