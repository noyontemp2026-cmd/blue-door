<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Door</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars"></div>

<!-- ================= WELCOME ================= -->

<section id="welcome">

    <div class="content">

        <h1>This website is made olny for Mitu Medam.</h1>

        <p>
            If you're not that person,<br>
            please don't continue.
        </p>

        <div class="buttons">

            <button id="mituBtn">❤️ I'm Mitu</button>

            <button id="otherBtn">👤 Others</button>

        </div>

    </div>

</section>

<!-- ================= OTHERS ================= -->

<section id="othersScreen" class="hidden">

    <div class="content">

        <h1>Sorry!</h1>

        <p>This website isn't for you.</p>

        <button id="leaveBtn">Go Back</button>

    </div>

</section>

<!-- ================= VERIFY ================= -->

<section id="verifyScreen" class="hidden">

    <div class="box">

        <h2>Verification Required</h2>

        <p>Enter your favourite Gali.</p>

        <input
            id="secretInput"
            type="text"
            placeholder="Secret Word"
        >

        <button id="continueBtn">
            Continue →
        </button>

        <small id="message"></small>

    </div>

</section>

<!-- ================= DOOR ================= -->

<section id="doorScene" class="hidden">

    <div class="content">

        <h1>Welcome Back...</h1>

        <h2>Mitu Medam💙</h2>

        <div class="door">

            <div class="knob"></div>

        </div>

        <p>Every door doesn't open for everyone.</p>

        <button id="openDoorBtn">
            🚪 Open The Door
        </button>

    </div>

</section>

<!-- ================= FINAL ================= -->

<section id="messageScene" class="hidden">

    <div class="content">

        <h1 id="finalText"></h1>

        <button id="endBtn" class="hidden">
            ❤️ Thanks 
        </button>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
